version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: gs_workhub_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: gs_workhub
      POSTGRES_PASSWORD: gs_workhub_dev_password
      POSTGRES_DB: gs_workhub
    ports:
      - "5432:5432"
    volumes:
      - gs_workhub_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: gs_workhub_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - gs_workhub_redis_data:/data

volumes:
  gs_workhub_postgres_data:
  gs_workhub_redis_data:
